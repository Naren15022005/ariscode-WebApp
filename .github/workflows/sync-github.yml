name: GitHub Sync

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours
  workflow_dispatch:          # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @ariscode/shared build
          pnpm --filter @ariscode/core build

      - name: Run migrations
        run: pnpm db:migrate

      - name: Run GitHub sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm sync:github

      - name: Commit updated database
        run: |
          git config user.name  "ArisCode Sync Bot"
          git config user.email "sync-bot@ariscode.dev"
          git add database/ariscode.db || true
          git diff --staged --quiet || git commit -m "chore: github sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || true
