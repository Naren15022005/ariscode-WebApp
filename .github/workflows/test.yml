name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @ariscode/shared build

      - name: Build core
        run: pnpm --filter @ariscode/core build

      - name: Unit tests (core)
        run: pnpm --filter @ariscode/core test --run

      - name: TypeCheck (all)
        run: pnpm typecheck
